name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      publish_npm:
        description: Publish through the configured npm trusted publisher
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      MONGODB_CLI_TEST_URI: mongodb://localhost:27017/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Validate tag and package metadata
        run: |
          python3 scripts/release.py check
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./build/npm/package.json');
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          assert.equal(pkg.repository.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          require('./build/npm/install.js').releaseBaseURL();
          NODE
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node --test build/npm/install.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/validate-agent-integration.py

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build and smoke-test native binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: python scripts/build-release.py build --target ${{ matrix.target }}
      - name: npm launcher tests
        run: node --test build/npm/install.test.js
      - name: Install npm tarball with the native binary
        run: npm --prefix build/npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/artifacts/*
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/artifacts
          merge-multiple: true
      - run: python scripts/build-release.py assemble
      - name: Create complete binary release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if node -e 'process.exit(require(process.argv[1]).isDraft ? 0 : 1)' "$RUNNER_TEMP/release.json"; then
              gh release upload "$RELEASE_TAG" dist/release/mongodb-cli-* dist/release/checksums.txt dist/release/LICENSE --clobber
              gh release edit "$RELEASE_TAG" --draft=false --notes-file dist/release/notes.md
            else
              echo "Published release exists; preserving its assets."
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file dist/release/notes.md
            gh release upload "$RELEASE_TAG" dist/release/mongodb-cli-* dist/release/checksums.txt dist/release/LICENSE
            gh release edit "$RELEASE_TAG" --draft=false
          fi
      - name: Verify public downloads and prepare npm tarball
        working-directory: build/npm
        run: |
          node check-release.js
          npm pack --pack-destination ../../dist --json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/cognelis-mongodb-cli-*.tgz
          if-no-files-found: error

  npm:
    needs: release
    if: inputs.publish_npm || vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Publish through npm trusted publishing
        working-directory: build/npm
        run: |
          node -e 'const [a,b,c]=require("node:child_process").execSync("npm --version",{encoding:"utf8"}).trim().split(".").map(Number); if(a<11 || (a===11 && (b<5 || (b===5 && c<1)))) throw Error("npm >=11.5.1 is required");'
          npm run release:publish
